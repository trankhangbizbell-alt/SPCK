<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Báo Mới - Trang chủ</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="./style.css" />

    <!-- Firebase -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-app-compat.min.js"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-firestore-compat.min.js"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-auth-compat.min.js"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="./firebase-config.js"></script>
  </head>

  <body>
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
          <a class="navbar-brand" href="./index.html">Báo Mới</a>
          <button
            class="navbar-toggler"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" href="./categories.html?category=business">Kinh doanh</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="./categories.html?category=education">Giáo dục</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="./categories.html?category=technology">Công nghệ</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="./categories.html?category=entertainment">Giải trí</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="./categories.html?category=other">Khác</a>
              </li>
            </ul>

            <!-- Thông tin người dùng, do firebase-config.js hiển thị -->
            <div class="d-flex me-2" id="user-infor"></div>

            <form class="d-flex" id="form-search">
              <input
                class="form-control me-2"
                type="search"
                id="txt-search"
                placeholder="Tìm bài viết"
                aria-label="Search"
              />
              <button class="btn btn-secondary" type="submit">Tìm</button>
            </form>
          </div>
        </div>
      </nav>
    </header>

    <div id="carouselExampleControls" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="./img/image.1.png" class="d-block w-100" alt="hinh anh" />
        </div>
        <div class="carousel-item">
          <img src="./img/image.2.png" class="d-block w-100" alt="hinh anh" />
        </div>
        <div class="carousel-item">
          <img src="./img/image.3.png" class="d-block w-100" alt="hinh anh" />
        </div>
        <div class="carousel-item">
          <img src="./img/image.4.png" class="d-block w-100" alt="hinh anh" />
        </div>
        <div class="carousel-item">
          <img src="./img/image.5.png" class="d-block w-100" alt="hinh anh" />
        </div>
        <div class="carousel-item">
          <img src="./img/image.6.png" class="d-block w-100" alt="hinh anh" />
        </div>
      </div>
      <button
        class="carousel-control-prev"
        type="button"
        data-bs-target="#carouselExampleControls"
        data-bs-slide="prev"
      >
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button
        class="carousel-control-next"
        type="button"
        data-bs-target="#carouselExampleControls"
        data-bs-slide="next"
      >
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>

    <br />

    <div class="container">
      <h1>TIN TỨC NỔI BẬT</h1>
      <div class="row" id="top-news"></div>

      <div class="d-flex justify-content-center my-4">
        <button class="btn btn-primary" id="btn-load">Tải thêm</button>
      </div>
    </div>

    <footer class="bg-primary text-white p-4 mt-5">
      <div class="container">
        <h5>Báo Mới</h5>
        <p class="small mb-1">Tin tức tổng hợp 24h: thời sự, kinh doanh, giáo dục, công nghệ, giải trí, thể thao.</p>
        <p class="small mb-0">Liên hệ hotline: (024) 3-542-3555 - Email: contact.baomoi@epi.com.vn</p>
      </div>
    </footer>

    <script src="./script.js"></script>
  </body>
</html>
