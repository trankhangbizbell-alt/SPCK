<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Báo Mới</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./style.css">

    <!-- Firebase -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-app-compat.min.js"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-firestore-compat.min.js"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-auth-compat.min.js"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="./firebase-config.js"></script>
</head>

<body>
    <div class="vh-100 d-flex justify-content-center align-items-center">
        <div class="card shadow p-5" style="width: 450px;">
            <h1 class="mb-3 text-center">Đăng nhập</h1>

            <input id="txt-email" class="form-control mb-3" type="email" placeholder="Email">
            <input id="txt-password" class="form-control mb-3" type="password" placeholder="Mật khẩu">

            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="chk-remember" checked>
                <label class="form-check-label" for="chk-remember">Ghi nhớ đăng nhập</label>
            </div>

            <button id="btn-login" class="btn btn-primary mb-3">Đăng nhập</button>

            <a class="text-primary text-center fw-bolder text-decoration-none" href="./signup.html">
                Tạo tài khoản mới
            </a>
            <a class="text-secondary text-center text-decoration-none mt-2" href="./index.html">
                Về trang chủ
            </a>
        </div>
    </div>

    <script src="./signin.js"></script>
</body>

</html>
