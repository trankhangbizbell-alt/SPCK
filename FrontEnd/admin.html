<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản trị - Báo Mới</title>

    <link rel="stylesheet" href="./admin.css">

    <!-- Firebase -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-app-compat.min.js"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-firestore-compat.min.js"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-auth-compat.min.js"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="./firebase-config.js"></script>
</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h2>NEWS ADMIN</h2>
        <a href="#form-box">Đăng bài viết</a>
        <a href="#list-box">Danh sách bài viết</a>
        <a href="./index.html">Trang chủ</a>
        <a href="#" id="btn-logout">Đăng xuất</a>
    </div>

    <!-- MAIN -->
    <div class="main">

        <div class="header">
            <h2>Trang quản trị</h2>
            <p id="current-user">Đang kiểm tra đăng nhập...</p>
        </div>

        <div class="content">

            <!-- THỐNG KÊ -->
            <div class="cards">
                <div class="card">
                    <h3>Tổng bài viết</h3>
                    <h2 id="total-posts">0</h2>
                </div>
                <div class="card">
                    <h3>Tổng lượt xem</h3>
                    <h2 id="total-views">0</h2>
                </div>
                <div class="card">
                    <h3>Đã đăng</h3>
                    <h2 id="published-posts">0</h2>
                </div>
                <div class="card">
                    <h3>Bản nháp</h3>
                    <h2 id="draft-posts">0</h2>
                </div>
            </div>

            <!-- FORM ĐĂNG BÀI -->
            <div class="table-box" id="form-box">
                <h2 id="form-title">Đăng bài viết mới</h2>

                <label>Tiêu đề</label>
                <input type="text" id="txt-title" placeholder="Nhập tiêu đề bài viết">

                <label>Danh mục</label>
                <select id="sl-category">
                    <option value="business">Kinh doanh</option>
                    <option value="education">Giáo dục</option>
                    <option value="technology">Công nghệ</option>
                    <option value="entertainment">Giải trí</option>
                    <option value="other">Khác</option>
                </select>

                <label>Ảnh bài viết</label>
                <input type="file" id="file-image" accept="image/*">
                <div>
                    <img id="img-preview" class="preview" src="" alt="Ảnh xem trước" style="display: none;">
                </div>

                <label>Mô tả ngắn</label>
                <textarea id="txt-description" rows="2" placeholder="Mô tả ngắn hiển thị ngoài trang chủ"></textarea>

                <label>Nội dung</label>
                <textarea id="txt-content" rows="8" placeholder="Nội dung chi tiết của bài viết"></textarea>

                <label>Trạng thái</label>
                <select id="sl-status">
                    <option value="published">Đã đăng</option>
                    <option value="draft">Bản nháp</option>
                </select>

                <div class="form-actions">
                    <button id="btn-save">Đăng bài</button>
                    <button id="btn-cancel" class="btn-grey" style="display: none;">Hủy sửa</button>
                </div>
            </div>

            <br>

            <!-- DANH SÁCH BÀI VIẾT -->
            <div class="table-box" id="list-box">
                <h2>Quản lý bài viết</h2>

                <input type="text" id="search" placeholder="Tìm bài viết...">

                <table>
                    <thead>
                        <tr>
                            <th>Tiêu đề</th>
                            <th>Danh mục</th>
                            <th>Tác giả</th>
                            <th>Ngày đăng</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="articles">
                        <tr>
                            <td colspan="6">Đang tải dữ liệu...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <script src="./admin.js"></script>
</body>

</html>
